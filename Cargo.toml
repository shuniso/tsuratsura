[package]
name = "tsuratsura"
version = "0.6.0"
edition = "2024"
rust-version = "1.88"
description = "つらつら — 1日の仕事を、つらつら書く。今日の1枚のプレーンテキスト業務メモ"
license = "MIT"
publish = false

[dependencies]
atomic-write-file = "0.3.1"
chrono = { version = "0.4.45", default-features = false, features = ["clock", "std"] }
directories = "6.0.0"
fs4 = { version = "1.1.0", features = ["sync"] }
image = { version = "0.25", default-features = false, features = ["png"] }
iced = { version = "0.14", default-features = false, features = [
    "wgpu",
    "tiny-skia",
    "crisp",
    "thread-pool",
    "advanced",
] }
serde = { version = "1.0.229", features = ["derive"] }
toml = "1.1.6"

[build-dependencies]
winresource = "0.1.31"

[profile.release]
lto = "thin"
codegen-units = 1
strip = true

[target.'cfg(target_os = "macos")'.dependencies]
libc = "0.2"
